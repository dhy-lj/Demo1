<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一个网站</title>
    <style>
        /* ================= 基础样式重置 ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
        }

        /* ================= 导航栏样式 ================= */
        header {
            background-color: #1e293b; /* 深色背景 */
            color: white;
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            margin-left: 20px;
            transition: color 0.3s;
        }

            .nav-links a:hover {
                color: white;
            }

        /* ================= 主体内容样式 ================= */
        main {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* 欢迎区域 */
        .hero {
            text-align: center;
            background: white;
            padding: 60px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 40px;
        }

            .hero h1 {
                font-size: 2.5rem;
                color: #0f172a;
                margin-bottom: 15px;
            }

            .hero p {
                font-size: 1.2rem;
                color: #64748b;
                margin-bottom: 30px;
            }

        /* 按钮样式 */
        .btn {
            display: inline-block;
            padding: 12px 28px;
            background-color: #2563eb; /* 主题蓝 */
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.2s;
        }

            .btn:hover {
                background-color: #1d4ed8;
                transform: translateY(-2px); /* 悬停时稍微上浮 */
            }

        /* 功能卡片区域 */
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.3s;
            border-top: 4px solid #2563eb; /* 顶部蓝色装饰条 */
        }

            .card:hover {
                transform: translateY(-5px);
                box-shadow: 0 10px 15px rgba(0,0,0,0.1);
            }

            .card h3 {
                margin-bottom: 10px;
                color: #1e293b;
            }

            .card p {
                color: #64748b;
                font-size: 0.95rem;
            }

        /* ================= 页脚样式 ================= */
        footer {
            text-align: center;
            padding: 30px;
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 50px;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>

    <!-- 顶部导航栏 -->
    <header>
        <nav>
            <div class="logo">我的网站</div>
            <div class="nav-links">
                <a href="#home">首页</a>
                <a href="#features">功能</a>
                <a href="#about">关于</a>
            </div>
        </nav>
    </header>

    <!-- 主体内容 -->
    <main>
        <!-- 欢迎区块 -->
        <section class="hero" id="home">
            <h1>欢迎来到我的第一个网站 🚀</h1>
            <p>这是我使用纯 HTML 和 CSS 编写的静态网页，现在已经成功部署在 GitHub Pages 上了。</p>
            <!-- 按钮点击后跳转到下方功能区 -->
            <a href="#features" class="btn">探索更多</a>
        </section>

        <!-- 卡片区块 -->
        <section class="features" id="features">
            <div class="card">
                <h3>💡 极简设计</h3>
                <p>没有复杂的框架，只有干净的代码和响应式布局，手机和电脑端都能完美显示。</p>
            </div>
            <div class="card">
                <h3>⚡ 快速加载</h3>
                <p>单文件结构，无需额外加载外部资源，网页打开速度极快，用户体验非常好。</p>
            </div>
            <div class="card">
                <h3>🌐 免费托管</h3>
                <p>利用 GitHub Pages 的免费服务，任何人可以通过互联网随时访问这个页面。</p>
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer id="about">
        <p>© 2024 我的网站. 保留所有权利。</p>
        <p>Made with ❤️ by 你的名字</p>
    </footer>

</body>
</html>
